<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuoSign — Side Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #0d0e13;
            --surface: #14161d;
            --surface-2: #1b1d26;
            --surface-3: #22252f;
            --border: #2a2d3a;
            --border-hi: #363a4e;
            --text-1: #edf0ff;
            --text-2: #8b94b8;
            --text-3: #4e5570;
            --accent: #5b8ef0;
            --accent-btn-top: #6b9cf2;
            --teal: #2dd4bf;
            --success: #4ade80;
            --error: #f87171;
            --font-main: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
            --raised-sm: 0 1px 0 rgba(255, 255, 255, 0.045), 0 2px 6px rgba(0, 0, 0, 0.3);
            --inset: inset 0 2px 5px rgba(0, 0, 0, 0.55), inset 0 1px 2px rgba(0, 0, 0, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg);
            color: var(--text-1);
            font-size: 14px;
            line-height: 1.5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ────────────────────────────────────────────────── */
        .header {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--accent), var(--teal));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
        }

        .header h1 {
            font-size: 14px;
            font-weight: 600;
        }

        .mode-label {
            margin-left: auto;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--teal);
            border: 1px solid rgba(45, 212, 191, 0.2);
            border-radius: 6px;
            padding: 2px 8px;
        }

        /* ── Status bar ────────────────────────────────────────────── */
        .status-bar {
            padding: 6px 16px;
            font-size: 11px;
            color: var(--text-3);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        /* ── Input section ─────────────────────────────────────────── */
        .input-section {
            padding: 12px 16px;
            flex-shrink: 0;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap textarea {
            width: 100%;
            min-height: 56px;
            max-height: 120px;
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-1);
            font-family: var(--font-main);
            font-size: 13px;
            resize: vertical;
            outline: none;
        }

        .input-wrap textarea:focus {
            border-color: rgba(91, 142, 240, 0.5);
            box-shadow: 0 0 0 3px rgba(91, 142, 240, 0.16);
        }

        .input-wrap textarea::placeholder {
            color: var(--text-3);
        }

        .input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .char-count {
            font-size: 11px;
            color: var(--text-3);
            font-family: var(--font-mono);
        }

        .translate-btn {
            padding: 6px 18px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(180deg, var(--accent-btn-top), var(--accent));
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--raised-sm);
            transition: all 0.15s;
        }

        .translate-btn:hover {
            filter: brightness(1.08);
        }

        .translate-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        /* ── Gloss chips ───────────────────────────────────────────── */
        .gloss-bar {
            padding: 0 16px 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
            flex-shrink: 0;
        }

        .chip {
            font-size: 11px;
            font-weight: 600;
            font-family: var(--font-mono);
            padding: 3px 10px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-2);
            cursor: pointer;
            transition: all 0.12s;
        }

        .chip:hover {
            border-color: var(--border-hi);
            color: var(--text-1);
        }

        .chip.active {
            background: rgba(91, 142, 240, 0.12);
            border-color: rgba(91, 142, 240, 0.3);
            color: var(--accent);
        }

        .method-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: auto;
        }

        .method-badge.rule {
            background: rgba(45, 212, 191, 0.1);
            color: var(--teal);
        }

        .method-badge.llm {
            background: rgba(91, 142, 240, 0.1);
            color: var(--accent);
        }

        /* ── Render mode toggle ────────────────────────────────────── */
        .render-toggle-bar {
            padding: 0 16px 8px;
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .render-toggle {
            display: flex;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2px;
            box-shadow: var(--inset);
        }

        .render-toggle button {
            padding: 4px 12px;
            font-size: 10px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-3);
            cursor: pointer;
            transition: all 0.15s;
            font-family: var(--font-main);
        }

        .render-toggle button.active {
            background: var(--surface);
            border: 1px solid var(--border-hi);
            color: var(--text-1);
            box-shadow: var(--raised-sm);
        }

        /* ── Canvas area ───────────────────────────────────────────── */
        .canvas-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--surface);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .canvas-area canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #avatarContainer {
            width: 100%;
            height: 100%;
            display: none;
        }

        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .empty-state .icon {
            font-size: 32px;
            margin-bottom: 8px;
            background: var(--surface-2);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state p {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-2);
        }

        .empty-state .sub {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 4px;
            max-width: 220px;
            text-align: center;
        }

        .current-gloss {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font-mono);
            color: var(--accent);
            background: rgba(14, 16, 29, 0.8);
            padding: 3px 12px;
            border-radius: 6px;
            border: 1px solid rgba(91, 142, 240, 0.2);
            pointer-events: none;
        }

        /* ── Playback controls ─────────────────────────────────────── */
        .controls {
            padding: 10px 16px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 8px;
            color: var(--text-2);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.12s;
        }

        .ctrl-btn:hover {
            border-color: var(--border-hi);
            color: var(--text-1);
        }

        .ctrl-btn.active {
            background: rgba(91, 142, 240, 0.12);
            border-color: rgba(91, 142, 240, 0.3);
            color: var(--accent);
        }

        .ctrl-btn.play {
            width: 40px;
            height: 40px;
            background: linear-gradient(180deg, var(--accent-btn-top), var(--accent));
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 16px;
        }

        .ctrl-btn.play:hover {
            filter: brightness(1.1);
        }

        .speed-group {
            display: flex;
            gap: 3px;
            margin-left: 12px;
        }

        .speed-btn {
            padding: 4px 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 6px;
            color: var(--text-3);
            font-size: 10px;
            font-weight: 600;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: all 0.12s;
        }

        .speed-btn:hover {
            border-color: var(--border-hi);
            color: var(--text-1);
        }

        .speed-btn.active {
            background: rgba(91, 142, 240, 0.12);
            border-color: rgba(91, 142, 240, 0.3);
            color: var(--accent);
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">DS</div>
        <h1>DuoSign</h1>
        <div class="mode-label" id="modeLabel">TEXT SELECTION</div>
    </div>

    <!-- Status -->
    <div class="status-bar" id="statusBar">● Ready — highlight text on any page to sign</div>

    <!-- Input -->
    <div class="input-section">
        <div class="input-wrap">
            <textarea id="textInput" placeholder="Type or paste text to translate to ASL…" maxlength="500"
                rows="2"></textarea>
        </div>
        <div class="input-footer">
            <span class="char-count" id="charCount">0/500</span>
            <button class="translate-btn" id="translateBtn">Translate</button>
        </div>
    </div>

    <!-- Gloss chips -->
    <div class="gloss-bar">
        <div id="glossChips"></div>
        <span class="method-badge" id="methodBadge"></span>
    </div>

    <!-- Render mode toggle -->
    <div class="render-toggle-bar">
        <div class="render-toggle" id="renderToggle">
            <button class="active" data-mode="skeleton">Skeleton 2D</button>
            <button data-mode="avatar">Avatar 3D</button>
        </div>
    </div>

    <!-- Canvas area -->
    <div class="canvas-area">
        <canvas id="signCanvas"></canvas>
        <div id="avatarContainer"></div>
        <div class="empty-state" id="emptyState">
            <div class="icon">🤟</div>
            <p>Ready to Sign</p>
            <div class="sub">Highlight text on any web page, right-click and select "Send to DuoSign" to see the ASL
                translation.</div>
        </div>
        <div class="current-gloss" id="currentGloss"></div>
    </div>

    <!-- Playback controls -->
    <div class="controls">
        <button class="ctrl-btn" id="prevBtn">◀</button>
        <button class="ctrl-btn" id="stopBtn">◼</button>
        <button class="ctrl-btn play" id="playBtn">▶</button>
        <button class="ctrl-btn" id="nextBtn">▶</button>
        <button class="ctrl-btn" id="loopBtn" title="Loop">↻</button>
        <div class="speed-group">
            <button class="speed-btn" data-speed="0.5">0.5×</button>
            <button class="speed-btn active" data-speed="1">1×</button>
            <button class="speed-btn" data-speed="1.5">1.5×</button>
            <button class="speed-btn" data-speed="2">2×</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="lib/asset-manager.js"></script>
    <script src="lib/pose-parser.js"></script>
    <script src="lib/skeleton-renderer.js"></script>
    <script src="lib/pose-player.js"></script>
    <script src="lib/api.js"></script>
    <script src="sidepanel.js"></script>
</body>

</html>
