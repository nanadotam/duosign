<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DuoSign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0e13;
      --surface: #14161d;
      --surface-2: #1b1d26;
      --surface-3: #22252f;
      --border: #2a2d3a;
      --border-hi: #363a4e;
      --text-1: #edf0ff;
      --text-2: #8b94b8;
      --text-3: #4e5570;
      --accent: #5b8ef0;
      --accent-dim: #3b6bd0;
      --accent-glow: rgba(91, 142, 240, 0.16);
      --accent-btn-top: #6b9cf2;
      --teal: #2dd4bf;
      --success: #4ade80;
      --error: #f87171;
      --raised-sm: 0 1px 0 rgba(255,255,255,0.045), 0 2px 6px rgba(0,0,0,0.3);
      --raised-press: 0 0px 0 rgba(255,255,255,0.02), 0 1px 3px rgba(0,0,0,0.5);
      --font-main: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-main);
      background: var(--surface);
      color: var(--text-1);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      width: 380px;
      overflow: hidden;
    }

    .popup-header {
      padding: 14px 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--teal));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 13px;
      flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 600; }
    .version {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-3);
      background: var(--surface-3);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 999px;
      margin-left: auto;
    }

    .greeting {
      padding: 18px 16px 10px;
    }
    .wave { font-size: 20px; display: inline-block; animation: wave-hand 1.5s ease-in-out 1; }
    .name {
      font-size: 18px; font-weight: 700;
      background: linear-gradient(90deg, var(--text-1), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub { font-size: 12px; color: var(--text-3); margin-top: 3px; }

    .modes {
      padding: 4px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mode-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: var(--raised-sm);
    }
    .mode-btn:hover {
      border-color: var(--border-hi);
      background: var(--surface-3);
    }
    .mode-btn:active {
      transform: translateY(1px);
      box-shadow: var(--raised-press);
    }
    .mode-btn .icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .mode-btn .icon.blue { background: rgba(91,142,240,0.12); }
    .mode-btn .icon.red { background: rgba(248,113,113,0.12); }
    .mode-btn .icon.green { background: rgba(45,212,191,0.12); }
    .mode-btn .label { font-size: 13px; font-weight: 600; color: var(--text-1); }
    .mode-btn .desc { font-size: 11px; color: var(--text-3); margin-top: 1px; }
    .mode-btn .arrow {
      margin-left: auto;
      color: var(--text-3);
      font-size: 18px;
    }

    .popup-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hint {
      font-size: 10px;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .kbd {
      font-family: var(--font-mono);
      font-size: 9px;
      padding: 2px 5px;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-2);
    }
    .settings-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      color: var(--text-2);
      cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .settings-btn:hover {
      background: var(--surface-2);
      color: var(--text-1);
    }

    @keyframes wave-hand {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(20deg); }
      75% { transform: rotate(-15deg); }
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <div class="logo">DS</div>
    <div class="header-title">DuoSign</div>
    <div class="version">v0.1.0</div>
  </div>

  <div class="greeting">
    <div>
      <span class="wave">👋</span>
      <span class="name" id="greetingName">Hello, User!</span>
    </div>
    <div class="sub">Highlight text anywhere to translate to ASL</div>
  </div>

  <div class="modes">
    <div class="mode-btn" id="btnTextSelection">
      <div class="icon blue">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
      </div>
      <div>
        <div class="label">Text Selection</div>
        <div class="desc">Highlight text, right-click to sign</div>
      </div>
      <span class="arrow">›</span>
    </div>

    <div class="mode-btn" id="btnYoutube">
      <div class="icon red">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="4"/><path d="M10 9l5 3-5 3z" fill="#f87171"/></svg>
      </div>
      <div>
        <div class="label">YouTube Captions</div>
        <div class="desc">Sign along with video captions</div>
      </div>
      <span class="arrow">›</span>
    </div>

    <div class="mode-btn" id="btnPdf">
      <div class="icon green">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
      </div>
      <div>
        <div class="label">PDF Reader</div>
        <div class="desc">Read PDFs with sign language side pane</div>
      </div>
      <span class="arrow">›</span>
    </div>
  </div>

  <div class="popup-footer">
    <div class="hint">
      Shortcut: <span class="kbd">Ctrl</span>+<span class="kbd">Shift</span>+<span class="kbd">S</span>
    </div>
    <button class="settings-btn" id="btnSettings" title="Settings">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
