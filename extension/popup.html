<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DuoSign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0e13;
      --surface: #14161d;
      --surface-2: #1b1d26;
      --border: #2a2d3a;
      --border-hi: #363a4e;
      --text-1: #edf0ff;
      --text-2: #8b94b8;
      --text-3: #4e5570;
      --accent: #5b8ef0;
      --teal: #2dd4bf;
      --success: #4ade80;
      --error: #f87171;
      --font-main: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--text-1);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--teal));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
    }

    .version {
      margin-left: auto;
      font-size: 10px;
      color: var(--text-3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2px 8px;
    }

    /* Health indicator */
    .health {
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-3);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .health-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-3);
    }

    .health-dot.online {
      background: var(--success);
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.4);
    }

    .health-dot.offline {
      background: var(--error);
    }

    /* Body */
    .body {
      padding: 18px;
    }

    .greeting {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-3);
      margin-bottom: 16px;
    }

    /* Mode buttons */
    .mode-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-1);
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn:hover {
      border-color: var(--border-hi);
      background: var(--surface-2);
    }

    .mode-btn .icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .mode-btn .icon.text {
      background: rgba(91, 142, 240, 0.12);
    }

    .mode-btn .icon.yt {
      background: rgba(239, 68, 68, 0.12);
    }

    .mode-btn .icon.pdf {
      background: rgba(45, 212, 191, 0.12);
    }

    .mode-btn .label {
      font-size: 13px;
      font-weight: 600;
    }

    .mode-btn .desc {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 1px;
    }

    .mode-btn .arrow {
      margin-left: auto;
      font-size: 14px;
      color: var(--text-3);
    }

    /* Footer */
    .footer {
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-3);
    }

    .kbd {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 600;
    }

    .settings-gear {
      width: 30px;
      height: 30px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-3);
      font-size: 14px;
      transition: all 0.15s;
    }

    .settings-gear:hover {
      border-color: var(--border-hi);
      color: var(--text-1);
    }

    /* Download overlay */
    .download-overlay {
      display: none;
      padding: 24px 18px;
      text-align: center;
    }

    .download-overlay.visible {
      display: block;
    }

    .download-overlay h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .download-overlay .dl-label {
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 12px;
    }

    .download-overlay .dl-progress {
      font-size: 11px;
      color: var(--accent);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .dl-bar-wrap {
      width: 100%;
      height: 6px;
      background: var(--surface-2);
      border-radius: 3px;
      overflow: hidden;
    }

    .dl-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--teal));
      border-radius: 3px;
      transition: width 0.3s ease;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo">DS</div>
    <h1>DuoSign</h1>
    <span class="version">v0.1.0</span>
  </div>

  <div class="health">
    <div class="health-dot" id="healthDot"></div>
    <span id="healthLabel">Checking…</span>
  </div>

  <div class="body">
    <div id="greeting" class="greeting">👋 Hello, User!</div>
    <div class="subtitle">Highlight text anywhere to translate to ASL</div>

    <!-- Download overlay (first install) -->
    <div class="download-overlay" id="downloadOverlay">
      <h3>Setting up DuoSign</h3>
      <div class="dl-label" id="downloadLabel">Preparing download…</div>
      <div class="dl-progress" id="downloadProgress">0%</div>
      <div class="dl-bar-wrap">
        <div class="dl-bar" id="downloadBar"></div>
      </div>
    </div>

    <!-- Mode buttons -->
    <div id="modeButtons">
      <button class="mode-btn" data-mode="text">
        <div class="icon text">T</div>
        <div>
          <div class="label">Text Selection</div>
          <div class="desc">Highlight text, right-click to sign</div>
        </div>
        <span class="arrow">›</span>
      </button>
      <button class="mode-btn" data-mode="youtube">
        <div class="icon yt">▶</div>
        <div>
          <div class="label">YouTube Captions</div>
          <div class="desc">Sign along with video captions</div>
        </div>
        <span class="arrow">›</span>
      </button>
      <button class="mode-btn" data-mode="pdf">
        <div class="icon pdf">📄</div>
        <div>
          <div class="label">PDF Reader</div>
          <div class="desc">Read PDFs with sign language side pane</div>
        </div>
        <span class="arrow">›</span>
      </button>
    </div>
  </div>

  <div class="footer">
    <span>Shortcut: <span class="kbd">Ctrl</span> + <span class="kbd">Shift</span> + <span class="kbd">S</span></span>
    <button class="settings-gear" id="settingsBtn" title="Settings">⚙</button>
  </div>

  <script src="lib/asset-manager.js"></script>
  <script src="popup.js"></script>
</body>

</html>
