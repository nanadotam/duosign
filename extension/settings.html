<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuoSign — Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #0d0e13;
            --surface: #14161d;
            --surface-2: #1b1d26;
            --border: #2a2d3a;
            --border-hi: #363a4e;
            --text-1: #edf0ff;
            --text-2: #8b94b8;
            --text-3: #4e5570;
            --accent: #5b8ef0;
            --teal: #2dd4bf;
            --error: #f87171;
            --success: #4ade80;
            --font-main: 'DM Sans', -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg);
            color: var(--text-1);
            font-size: 14px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            max-width: 520px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        .page h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .page .subtitle {
            font-size: 13px;
            color: var(--text-3);
            margin-bottom: 24px;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-3);
            margin-bottom: 10px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 6px;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 8px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-1);
            font-family: var(--font-main);
            font-size: 13px;
            outline: none;
        }

        .field input:focus,
        .field select:focus {
            border-color: rgba(91, 142, 240, 0.5);
        }

        .field select {
            cursor: pointer;
        }

        .save-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 10px;
            background: linear-gradient(180deg, #6b9cf2, var(--accent));
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: filter 0.15s;
        }

        .save-btn:hover {
            filter: brightness(1.08);
        }

        .toast {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid rgba(45, 212, 191, 0.3);
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 12px;
            color: var(--teal);
            font-weight: 600;
            z-index: 100;
        }

        .toast.visible {
            display: block;
            animation: fadeIn .2s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }
        }

        /* Avatar management */
        .avatar-list {
            margin-top: 10px;
        }

        .avatar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .avatar-item .avatar-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--teal));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .avatar-item .avatar-info {
            flex: 1;
        }

        .avatar-item .avatar-name {
            font-size: 13px;
            font-weight: 600;
        }

        .avatar-item .avatar-size {
            font-size: 11px;
            color: var(--text-3);
        }

        .avatar-item .avatar-badge {
            font-size: 9px;
            font-weight: 600;
            padding: 2px 6px;
            background: rgba(45, 212, 191, 0.1);
            color: var(--teal);
            border-radius: 4px;
        }

        .avatar-item button {
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-2);
            cursor: pointer;
            transition: all 0.12s;
        }

        .avatar-item button:hover {
            border-color: var(--error);
            color: var(--error);
        }

        .avatar-item button.download-btn {
            border-color: rgba(91, 142, 240, 0.3);
            color: var(--accent);
        }

        .avatar-item button.download-btn:hover {
            background: rgba(91, 142, 240, 0.08);
        }

        .storage-info {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <div class="page">
        <h1>⚙️ DuoSign Settings</h1>
        <div class="subtitle">Customize your signing experience</div>

        <!-- User preferences -->
        <div class="section">
            <div class="section-title">User Preferences</div>
            <div class="card">
                <div class="field">
                    <label for="userName">Your Name</label>
                    <input type="text" id="userName" placeholder="Enter your name" />
                </div>
                <div class="field">
                    <label for="avatarMode">Render Mode</label>
                    <select id="avatarMode">
                        <option value="skeleton">Skeleton 2D (Lightweight)</option>
                        <option value="avatar">Avatar 3D (VRM Model)</option>
                    </select>
                </div>
                <div class="field">
                    <label for="defaultSpeed">Default Playback Speed</label>
                    <select id="defaultSpeed">
                        <option value="0.5">0.5× — Slow</option>
                        <option value="1" selected>1× — Normal</option>
                        <option value="1.5">1.5× — Fast</option>
                        <option value="2">2× — Very Fast</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Avatar Management -->
        <div class="section">
            <div class="section-title">Avatar Management</div>
            <div class="card">
                <p style="font-size: 12px; color: var(--text-3); margin-bottom: 10px;">
                    Manage downloaded VRM avatars. Each avatar is ~20 MB.
                </p>
                <div class="avatar-list" id="avatarList">
                    <!-- Populated by JS -->
                </div>
                <div class="storage-info" id="storageInfo">Calculating storage…</div>
            </div>
        </div>

        <!-- Save -->
        <button class="save-btn" id="saveBtn">💾 Save Settings</button>
    </div>

    <div class="toast" id="toast">✓ Settings saved</div>

    <script src="lib/asset-manager.js"></script>
    <script src="settings.js"></script>
</body>

</html>
