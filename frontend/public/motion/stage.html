<!doctype html>
<!--
  DuoSign Pro Motion stage — plays baked .dsanim clips (duosign-motion) on a three-vrm v3 avatar.
  Embedded by the app's AvatarPanel in an iframe and driven with postMessage:
    → { type: "play", glosses: [...], speed }   start a sentence from the top
    → { type: "pause" } | { type: "resume" }    pause / continue
    → { type: "speed", speed }                  playback speed multiplier
    → { type: "avatar", file }                  swap avatar (file in ./avatars/)
    → { type: "cam", kind }                     "sign" | "full" | "three" | "face"
    ← { type: "ready" } | { type: "avatar-loaded", file }
    ← { type: "progress", index, gloss, total } | { type: "ended" } | { type: "missing", glosses }
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuoSign Pro Motion</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 600 12px/1.4 system-ui, sans-serif;
         color: #8b94b8; letter-spacing: .04em; pointer-events: none; transition: opacity .3s; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.min.js"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">Loading avatar…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { DsanimPlayer, decodeClip, blendPose } from './dsanim-player.js';

const BLEND_SEC = 0.2;          // cross-fade between signs
const HOLD_SEC = 0.5;           // settle on the last sign before reporting "ended"
const params = new URLSearchParams(location.search);
const post = (msg) => parent.postMessage({ source: 'duosign-motion', ...msg }, '*');
const msgEl = document.getElementById('msg');
const say = (t) => { msgEl.textContent = t || ''; msgEl.style.opacity = t ? 1 : 0; };

// ------------------------------------------------------------------ scene
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.05, 50);
camera.position.set(0, 1.3, 2.4);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.2, 0); controls.enableDamping = true; controls.enablePan = false; controls.update();
scene.add(new THREE.HemisphereLight(0xfff4e6, 0x2a2420, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(1.2, 2.4, 2.6); scene.add(key);
const rim = new THREE.DirectionalLight(0xcfe3ff, 0.8); rim.position.set(-1.5, 2, -2); scene.add(rim);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
  if (vrm) setCam(cam, false);
}
addEventListener('resize', resize);

// ------------------------------------------------------------------ camera presets (framed from the avatar's bones)
let vrm = null, player = null, cam = params.get('cam') || 'sign', camAnim = null;
const bonePos = (n) => vrm?.humanoid.getNormalizedBoneNode(n)?.getWorldPosition(new THREE.Vector3());
function setCam(kind, animate = true) {
  cam = kind;
  if (!vrm) return;
  const head = bonePos('head') || new THREE.Vector3(0, 1.5, 0), hips = bonePos('hips') || new THREE.Vector3(0, 0.9, 0);
  const top = head.y + 0.32;
  let center, span, yaw = 0;
  if (kind === 'full') { center = new THREE.Vector3(0, top / 2, 0); span = top * 1.08; }
  else if (kind === 'face') { center = new THREE.Vector3(head.x, head.y + 0.07, head.z); span = 0.42; }
  else { center = new THREE.Vector3(0, (hips.y - 0.05 + top) / 2, 0); span = (top - hips.y + 0.05) * 1.15; }
  if (kind === 'three') yaw = -0.6;
  const fitH = span / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(fitH, fitH * 0.75 / Math.min(1, camera.aspect));
  const pos = new THREE.Vector3(center.x + Math.sin(yaw) * dist, center.y + 0.02, center.z + Math.cos(yaw) * dist);
  if (!animate) { camera.position.copy(pos); controls.target.copy(center); controls.update(); return; }
  camAnim = { t: 0, fromP: camera.position.clone(), fromT: controls.target.clone(), toP: pos, toT: center };
}

// ------------------------------------------------------------------ avatar
const loader = new GLTFLoader();
loader.register((p) => new VRMLoaderPlugin(p));
let avatarFile = null, loadToken = 0;
async function loadAvatar(file) {
  if (file === avatarFile) return;
  avatarFile = file;
  const token = ++loadToken;
  say('Loading avatar…');
  try {
    const gltf = await loader.loadAsync(`./avatars/${file}`);
    if (token !== loadToken) { VRMUtils.deepDispose(gltf.scene); return; }
    if (vrm) { scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); }
    vrm = gltf.userData.vrm;
    VRMUtils.rotateVRM0(vrm);
    scene.add(vrm.scene);
    vrm.update(0);
    player = new DsanimPlayer(vrm);
    player.useFace = true; player.useReach = true;
    if (seq.items[0]) player.prepare(seq.items[0].clip);
    setCam(cam, false);
    say('');
    post({ type: 'avatar-loaded', file });
  } catch (e) {
    console.error(e); say('Could not load avatar');
  }
}

// ------------------------------------------------------------------ clips + sentence
let index = {};
const cache = new Map();
async function getClip(id) {
  if (cache.has(id)) return cache.get(id);
  const p = fetch(`./${index[id].path}`).then((r) => r.json()).then(decodeClip);
  cache.set(id, p);
  return p;
}

// Word -> clip ids. Unknown words fingerspell letter by letter (letters without a clip are skipped).
function resolve(gloss) {
  const g = gloss.toUpperCase().trim().replace(/\s+/g, '_');
  if (index[g]) return [{ id: g, label: g }];
  const plain = g.replace(/[^A-Z0-9_]/g, '');
  if (index[plain]) return [{ id: plain, label: plain }];
  for (const alt of [plain.replace(/_/g, ''), plain.replace(/S$/, ''), plain.replace(/ED$/, ''), plain.replace(/ING$/, '')]) {
    if (alt && index[alt]) return [{ id: alt, label: alt }];
  }
  return [...plain.replace(/_/g, '')].filter((c) => index[c]).map((c) => ({ id: c, label: `${plain} (${c})`, word: plain }));
}

// Arms-down rest pose shown before anything plays (normalized bones, so it fits every avatar)
const REST = {
  leftUpperArm: [0, 0, -1.22], rightUpperArm: [0, 0, 1.22],
  leftLowerArm: [0, -0.15, 0], rightLowerArm: [0, 0.15, 0],
  leftHand: [0, 0, -0.1], rightHand: [0, 0, 0.1],
};
const _e = new THREE.Euler();
function applyRest() {
  const h = vrm.humanoid;
  for (const name of Object.keys(h.humanBones)) {
    const n = h.getNormalizedBoneNode(name); if (!n) continue;
    const r = REST[name];
    if (r) n.quaternion.setFromEuler(_e.set(r[0], r[1], r[2])); else n.quaternion.identity();
  }
}

let seq = { items: [], total: 0, words: [] }, time = 0, playing = false, speed = 1, endedSent = true, lastIdx = -1;
async function playSentence(glosses) {
  const items = [], missing = [];
  const words = glosses.map(String);
  for (let w = 0; w < words.length; w++) {
    const parts = resolve(words[w]);
    if (!parts.length) { missing.push(words[w]); continue; }
    if (parts.length > 1 || parts[0].word) missing.push(words[w]);
    for (const part of parts) {
      const d = await getClip(part.id);
      // fingerspelled letters play their core only; whole signs keep a little lead-in
      const [a, b] = d.segments?.core ?? [0, d.frames];
      items.push({ clip: d, id: part.id, label: part.label, wordIndex: w, in: a, out: b });
    }
  }
  if (missing.length) post({ type: 'missing', glosses: missing });
  let t = 0;
  for (const it of items) { it.start = t; it.dur = Math.max(1, it.out - it.in) / it.clip.fps; t += it.dur; }
  seq = { items, total: t, words };
  time = 0; lastIdx = -1; endedSent = false;
  playing = items.length > 0;
  if (player && items[0]) player.prepare(items[0].clip);
  if (!items.length) { endedSent = true; post({ type: 'ended' }); }
}
function locate(t) {
  const items = seq.items;
  for (let k = 0; k < items.length; k++) {
    const it = items[k];
    if (t < it.start + it.dur || k === items.length - 1) {
      return { k, it, local: Math.min(it.out - 1, it.in + (t - it.start) * it.clip.fps) };
    }
  }
}

// ------------------------------------------------------------------ messages from the app
addEventListener('message', (e) => {
  const m = e.data; if (!m || typeof m !== 'object') return;
  if (m.type === 'play') { if (m.speed) speed = m.speed; playSentence(m.glosses || []); }
  else if (m.type === 'pause') playing = false;
  else if (m.type === 'resume') { if (seq.items.length && !endedSent) playing = true; }
  else if (m.type === 'speed') speed = m.speed || 1;
  else if (m.type === 'avatar') loadAvatar(m.file);
  else if (m.type === 'cam') setCam(m.kind);
});

// ------------------------------------------------------------------ loop
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(0.1, clock.getDelta());
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt / 0.35); const s = camAnim.t * camAnim.t * (3 - 2 * camAnim.t);
    camera.position.lerpVectors(camAnim.fromP, camAnim.toP, s); controls.target.lerpVectors(camAnim.fromT, camAnim.toT, s);
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update();
  if (seq.items.length && vrm && player) {
    if (playing) time += dt * speed;
    const { k, it, local } = locate(Math.min(time, seq.total - 1e-4));
    if (k !== lastIdx) { lastIdx = k; post({ type: 'progress', index: it.wordIndex, gloss: it.label, total: seq.words.length }); }
    player.prepare(it.clip);
    let pose = player.framePose(it.clip, local);
    const into = time - it.start;
    if (k > 0 && into < BLEND_SEC) {
      const p = seq.items[k - 1]; const w = into / BLEND_SEC; const s = w * w * (3 - 2 * w);
      pose = blendPose(player.framePose(p.clip, p.out - 1), pose, s);
    }
    player.applyPose(pose); player.applyReach(it.clip, local); player.applyFace(it.clip, local);
    if (playing && !endedSent && time >= seq.total + HOLD_SEC) { endedSent = true; playing = false; post({ type: 'ended' }); }
  }
  else if (vrm) applyRest();
  vrm?.update(dt);
  renderer.render(scene, camera);
}

// ------------------------------------------------------------------ boot
resize();
tick();
index = await (await fetch('./index.json')).json();
await loadAvatar(params.get('avatar') || 'ama.vrm');
post({ type: 'ready' });
</script>
</body>
</html>
